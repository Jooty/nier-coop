[package]
name = "rc_launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[[bin]]
name = "rc_launcher"
path = "src/main.rs"

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
eframe = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
toml = { workspace = true, features = ["display"] }
thiserror = { workspace = true }
rc_launcher_core = { workspace = true }
rc_net = { workspace = true, features = ["iroh"] }

[features]
dev = []

[dev-dependencies]

[lints]
workspace = true
