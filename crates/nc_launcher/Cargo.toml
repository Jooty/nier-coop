[package]
name = "nc_launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"
autotests = false

[[bin]]
name = "nc_launcher"
path = "src/main.rs"

[[test]]
name = "all"
path = "tests/all.rs"

[[example]]
name = "first_run"
path = "examples/first_run.rs"
required-features = ["dev"]

[dependencies]
eframe = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
toml = { workspace = true, features = ["display"] }
thiserror = { workspace = true }
ureq = { workspace = true }
self-replace = { workspace = true }
ed25519-dalek = { workspace = true }
serde_json = { workspace = true }
replicant_game = { workspace = true }
nc_launcher_core = { workspace = true }
replicant_proto = { workspace = true }
nc_net = { workspace = true, features = ["iroh"] }
nc_ui_style = { workspace = true }

[features]
dev = []

[dev-dependencies]

[lints]
workspace = true
