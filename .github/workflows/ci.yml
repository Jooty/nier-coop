name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - "**/*.md"
      - tools/ghidra/symbols.tsv
  pull_request:
    paths-ignore:
      - docs/**
      - "**/*.md"
      - tools/ghidra/symbols.tsv

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux
    runs-on: [self-hosted, replicant-coop]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --check
      - run: python3 scripts/check_style.py
      - run: python3 scripts/check_comments.py
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  windows:
    name: windows
    runs-on: [self-hosted, replicant-coop]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo xwin clippy -p rc_hook --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo xwin build -p rc_hook --release --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc_hook-dll
          path: target/x86_64-pc-windows-msvc/release/rc_hook.dll
          if-no-files-found: error

  launcher-windows:
    name: launcher-windows
    needs: windows
    runs-on: [self-hosted, replicant-coop]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo xwin build -p rc_launcher --release --target x86_64-pc-windows-msvc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rc_hook-dll
          path: package
      - run: cp target/x86_64-pc-windows-msvc/release/rc_launcher.exe package/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replicant-coop-windows
          path: package
          if-no-files-found: error

  launcher-linux:
    name: launcher-linux
    needs: windows
    runs-on: [self-hosted, replicant-coop]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo build -p rc_launcher --release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rc_hook-dll
          path: package
      - run: cp target/release/rc_launcher package/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replicant-coop-linux
          path: package
          if-no-files-found: error
