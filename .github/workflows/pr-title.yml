name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title starts with a kind
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(fix|feat|perf|refactor|docs|chore|ci):\ [^\ ].* ]]; then
            echo "PR title must start with one of fix, feat, perf, refactor, docs, chore, ci followed by a colon and a space (see rules/pull-requests.md, The kind)."
            exit 1
          fi
