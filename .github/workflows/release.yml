name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NIERTOGETHER_CHANNEL: release
  NIERTOGETHER_VERSION: ${{ github.ref_name }}
  NIERTOGETHER_UPDATE_PUBLIC_KEY_HEX: ${{ vars.REPLICANT_COOP_RELEASE_PUBLIC_KEY_HEX }}
  HOOKS: "replicant:replicant_hook automata:automata_hook"

jobs:
  release:
    name: release
    runs-on: [self-hosted, replicant-coop]
    timeout-minutes: 90
    steps:
      - name: Check the release signing setup
        env:
          PUBLIC_KEY_HEX: ${{ vars.REPLICANT_COOP_RELEASE_PUBLIC_KEY_HEX }}
          SIGNING_KEY: ${{ secrets.REPLICANT_COOP_RELEASE_SIGNING_KEY }}
        run: |
          if [[ ! "$PUBLIC_KEY_HEX" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The repository variable REPLICANT_COOP_RELEASE_PUBLIC_KEY_HEX is missing or is not 64 lowercase hex characters. Run nt_release keygen and set it (see the release steps in the docs)."
            exit 1
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The repository secret REPLICANT_COOP_RELEASE_SIGNING_KEY is missing. Set it from the file nt_release keygen wrote."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build the release tool
        run: cargo build -p nt_release --release

      - name: Build the hook and the launchers
        run: |
          for hook in $HOOKS; do
            env -u NIERTOGETHER_UPDATE_URL -u NIERTOGETHER_LOG_TOKEN cargo xwin build -p "${hook#*:}" --release --target x86_64-pc-windows-msvc
          done
          env -u NIERTOGETHER_UPDATE_URL -u NIERTOGETHER_LOG_TOKEN cargo xwin build -p nt_launcher --release --target x86_64-pc-windows-msvc
          env -u NIERTOGETHER_UPDATE_URL -u NIERTOGETHER_LOG_TOKEN cargo build -p nt_launcher --release

      - name: Collect the release files
        run: |
          rm -rf dist
          mkdir dist
          for hook in $HOOKS; do
            cp "target/x86_64-pc-windows-msvc/release/${hook#*:}.dll" "dist/${hook#*:}.dll"
          done
          cp target/x86_64-pc-windows-msvc/release/nt_launcher.exe dist/niertogether-launcher.exe
          cp target/release/nt_launcher dist/niertogether-launcher-linux

      - name: Make and sign the manifest
        env:
          SIGNING_KEY: ${{ secrets.REPLICANT_COOP_RELEASE_SIGNING_KEY }}
        run: |
          key_file="$RUNNER_TEMP/release-signing.key"
          echo "RELEASE_KEY_FILE=$key_file" >> "$GITHUB_ENV"
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key_file")
          tool=target/release/nt_release
          hook_files=()
          for hook in $HOOKS; do
            hook_files+=(--file "dist/${hook#*:}.dll:hook@${hook%%:*}:windows")
          done
          "$tool" manifest \
            --channel release \
            --commit "$(git rev-parse HEAD)" \
            --commit-time "$(git show -s --format=%ct HEAD)" \
            "${hook_files[@]}" \
            --file dist/niertogether-launcher.exe:launcher:windows \
            --file dist/niertogether-launcher-linux:launcher:linux \
            --out dist/manifest.json
          "$tool" sign --key-file "$key_file" dist/manifest.json
          (cd dist && sha256sum *.dll niertogether-launcher.exe niertogether-launcher-linux manifest.json > SHA256SUMS)

      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            git log "${previous}..${TAG}" --format='- %s' > notes.md
          else
            git log "${TAG}" --format='- %s' > notes.md
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md \
            dist/*.dll \
            dist/niertogether-launcher.exe \
            dist/niertogether-launcher-linux \
            dist/manifest.json \
            dist/manifest.json.sig \
            dist/SHA256SUMS

      - name: Delete the signing key file
        if: always()
        run: rm -f "$RUNNER_TEMP/release-signing.key"
